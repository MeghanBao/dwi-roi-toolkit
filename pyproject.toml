[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dwi-roi-toolkit"
version = "0.1.0"
description = "Semi-automatic whole-volume ROI delineation and quantification on diffusion-weighted MRI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["MRI", "DWI", "ADC", "segmentation", "registration", "DICOM", "ITK-SNAP", "radiomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "SimpleITK>=2.3.0",
    "pydicom>=2.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
dwi-roi = "dwi_roi_toolkit.__main__:main"

[tool.setuptools]
packages = ["dwi_roi_toolkit"]
